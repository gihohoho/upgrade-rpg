name: Publish backend image candidate to GHCR

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "main의 게시 대상 전체 40자리 커밋 SHA"
        required: true
        type: string
      approved_preparation_commit:
        description: "소유자가 별도 승인한 직전 preparation 커밋의 전체 40자리 SHA"
        required: true
        type: string
      approval_reason:
        description: "게시 후보를 만드는 이유(10자 이상, secret 입력 금지)"
        required: true
        type: string
      confirm_publish:
        description: "검증 후 GHCR 후보 게시 단계까지 진행"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ghcr-backend-publish
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/gihohoho/upgrade-rpg-backend
  CERTIFICATE_IDENTITY: https://github.com/gihohoho/upgrade-rpg/.github/workflows/publish-backend-ghcr.yml@refs/heads/main
  OIDC_ISSUER: https://token.actions.githubusercontent.com
  PUBLISH_LIFECYCLE_PATH: deploy/github-actions-ghcr-publish-lifecycle.json
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  validate:
    name: Validate exact source and repository checks
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check manual approval inputs
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          APPROVED_PREPARATION_COMMIT: ${{ inputs.approved_preparation_commit }}
          APPROVAL_REASON: ${{ inputs.approval_reason }}
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
          EXPECTED_GITHUB_SHA: ${{ github.sha }}
          EXPECTED_GITHUB_REF: ${{ github.ref }}
          EXPECTED_EVENT_NAME: ${{ github.event_name }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_ACTOR: ${{ github.actor }}
          EXPECTED_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re

          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise SystemExit(message)

          source = os.environ["SOURCE_COMMIT"]
          preparation = os.environ["APPROVED_PREPARATION_COMMIT"]
          reason = os.environ["APPROVAL_REASON"].strip()
          require(os.environ["EXPECTED_EVENT_NAME"] == "workflow_dispatch", "only workflow_dispatch is allowed")
          require(os.environ["EXPECTED_GITHUB_REF"] == "refs/heads/main", "workflow must run from main")
          require(re.fullmatch(r"[0-9a-f]{40}", source) is not None, "source_commit must be a lowercase full SHA")
          require(re.fullmatch(r"[0-9a-f]{40}", preparation) is not None, "approved_preparation_commit must be a lowercase full SHA")
          require(source == os.environ["EXPECTED_GITHUB_SHA"], "source_commit must equal github.sha")
          require(source != preparation, "authorization commit must differ from the approved preparation commit")
          require(os.environ["EXPECTED_RUN_ATTEMPT"] == "1", "workflow re-runs are forbidden")
          require(os.environ["EXPECTED_ACTOR"] == os.environ["EXPECTED_REPOSITORY_OWNER"], "only the repository owner may publish")
          require(len(reason) >= 10, "approval_reason must contain at least 10 characters")
          require(os.environ["CONFIRM_PUBLISH"] == "true", "confirm_publish must be true")
          PY

      - name: Require exactly one first-attempt dispatch for this authorization
        env:
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise SystemExit(message)

          require(os.environ["EXPECTED_RUN_ATTEMPT"] == "1", "workflow re-runs are forbidden")
          owner, repository = os.environ["REPOSITORY"].split("/", 1)
          query = urllib.parse.urlencode({
              "event": "workflow_dispatch",
              "head_sha": os.environ["SOURCE_COMMIT"],
              "per_page": "100",
          })
          url = (
              f"https://api.github.com/repos/{owner}/{repository}/actions/workflows/"
              f"publish-backend-ghcr.yml/runs?{query}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['ACTIONS_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          expected_run_id = int(os.environ["EXPECTED_RUN_ID"])
          for retry in range(3):
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except (urllib.error.URLError, TimeoutError):
                  if retry == 2:
                      raise SystemExit("cannot verify unique workflow dispatch")
                  time.sleep(2)
                  continue
              runs = [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("event") == "workflow_dispatch"
                  and run.get("head_sha") == os.environ["SOURCE_COMMIT"]
                  and run.get("head_branch") == "main"
              ]
              require(len(runs) <= 1, "more than one dispatch exists for this authorization commit")
              if len(runs) == 1:
                  run = runs[0]
                  require(run.get("id") == expected_run_id, "the unique dispatch is not the current run")
                  require(run.get("run_attempt") == 1, "workflow re-runs are forbidden")
                  require(run.get("actor", {}).get("login") == os.environ["EXPECTED_ACTOR"], "workflow actor changed")
                  break
              if retry == 2:
                  raise SystemExit("current workflow dispatch is not visible as the unique run")
              time.sleep(2)
          PY

      - name: Check out exact source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify source-controlled authorization transition
        env:
          APPROVED_PREPARATION_COMMIT: ${{ inputs.approved_preparation_commit }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          import subprocess

          LIFECYCLE_PATH = "deploy/github-actions-ghcr-publish-lifecycle.json"

          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise SystemExit(message)

          def git(*args: str) -> str:
              return subprocess.run(
                  ("git", *args),
                  check=True,
                  capture_output=True,
                  text=True,
                  encoding="utf-8",
              ).stdout.strip()

          source = os.environ["SOURCE_COMMIT"]
          preparation = os.environ["APPROVED_PREPARATION_COMMIT"]
          require(os.environ["EXPECTED_RUN_ATTEMPT"] == "1", "workflow re-runs are forbidden")
          require(git("rev-parse", "HEAD") == source, "checked out HEAD differs from source_commit")
          ancestry = git("rev-list", "--parents", "-n", "1", source).split()
          require(len(ancestry) == 2, "authorization commit must have exactly one parent")
          require(ancestry[1] == preparation, "authorization commit is not a direct child of the approved preparation")
          changed = git("diff", "--name-only", "--diff-filter=ACDMRTUXB", preparation, source).splitlines()
          require(changed == [LIFECYCLE_PATH], "authorization commit may change only the publish lifecycle file")

          current = json.loads(Path(LIFECYCLE_PATH).read_text(encoding="utf-8"))
          parent = json.loads(git("show", f"{preparation}:{LIFECYCLE_PATH}"))
          require(parent.get("state") == "preparation-closed", "approved preparation lifecycle must be closed")
          require(parent.get("publishReviewerGateReady") is False, "approved preparation gate must be false")
          require(parent.get("approvedPreparationSha") is None, "approved preparation must not self-authorize")
          require(parent.get("ownerApproval", {}).get("recorded") is False, "approved preparation must await owner approval")

          require(current.get("state") == "authorization-open", "publish lifecycle is not authorization-open")
          require(current.get("publishReviewerGateReady") is True, "source-controlled publish gate is not open")
          require(current.get("approvedPreparationSha") == preparation, "lifecycle preparation SHA differs from owner input")
          require(current.get("ownerApproval", {}).get("recorded") is True, "owner approval is not recorded")
          require(
              current.get("ownerApproval", {}).get("evidence") == "exact-40-character-sha-user-message",
              "owner approval evidence type changed",
          )
          reviewed_at = datetime.fromisoformat(
              current["githubLiveSettings"]["recheckedAtUtc"].replace("Z", "+00:00")
          )
          age = (datetime.now(timezone.utc) - reviewed_at).total_seconds()
          require(0 <= age <= 14400, "GitHub live settings recheck is older than four hours")
          required_live = {
              "actionsAllowlistMatchesPlan": True,
              "fullLengthActionShaRequired": True,
              "githubOwnedActionsBlanketAllowed": False,
              "verifiedCreatorsBlanketAllowed": False,
              "forkWriteTokensEnabled": False,
              "forkSecretsEnabled": False,
              "actionsCanApprovePullRequests": False,
              "environmentExists": True,
              "environmentMainOnly": True,
              "environmentSecretsCount": 0,
              "environmentVariablesCount": 0,
              "nativeRequiredReviewerConfigured": False,
              "preventSelfReviewConfigured": False,
          }
          for key, expected in required_live.items():
              require(current["githubLiveSettings"].get(key) == expected, f"GitHub live setting differs: {key}")
          PY

      - name: Set up Python 3.11.15
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11.15"

      - name: Install backend validation dependencies
        run: |
          set -euo pipefail
          pip_wheels="$RUNNER_TEMP/pip-wheels"
          dev_wheels="$RUNNER_TEMP/backend-dev-wheels"
          mkdir -p "$pip_wheels" "$dev_wheels"
          python -m pip download \
            --dest "$pip_wheels" \
            --require-hashes \
            --only-binary=:all: \
            --platform any \
            --python-version 3.11 \
            --implementation py \
            --abi none \
            -r backend/requirements/pip-bootstrap.lock
          python -m pip install \
            --no-index \
            --find-links="$pip_wheels" \
            --require-hashes \
            --only-binary=:all: \
            -r backend/requirements/pip-bootstrap.lock
          python -m pip download \
            --dest "$dev_wheels" \
            --require-hashes \
            --only-binary=:all: \
            --platform manylinux_2_17_x86_64 \
            --platform manylinux2014_x86_64 \
            --platform any \
            --python-version 3.11 \
            --implementation cp \
            --abi cp311 \
            --abi abi3 \
            --abi none \
            -r backend/requirements/dev-linux-amd64-py311.lock
          python -m pip install \
            --no-index \
            --find-links="$dev_wheels" \
            --require-hashes \
            --only-binary=:all: \
            -r backend/requirements/dev-linux-amd64-py311.lock
          python -m pip install --no-deps --no-build-isolation -e ./backend

      - name: Run fail-closed repository checks
        run: |
          set -euo pipefail
          python tools/generate_backend_linux_dependency_locks.py --check
          python tools/check_github_actions_ghcr_static_plan.py --strict
          python -m compileall -q backend/app backend/scripts backend/alembic tools
          SKIP_GHCR_HANDOFF_SMOKES=1 bash tools/run_smoke_core.sh

  build_scan:
    name: Build locally, generate SBOM, and block vulnerabilities
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Set up Python 3.11.15
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11.15"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build local linux/amd64 image without registry mutation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: backend/Dockerfile.production
          platforms: linux/amd64
          load: true
          push: false
          tags: upgrade-rpg-backend:scan-${{ github.sha }}

      - name: Generate local SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: upgrade-rpg-backend:scan-${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Validate local SBOM structure
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("sbom.spdx.json").read_text(encoding="utf-8"))
          if payload.get("SPDXID") != "SPDXRef-DOCUMENT":
              raise SystemExit("SPDX document identifier is missing")
          if not str(payload.get("spdxVersion", "")).startswith("SPDX-"):
              raise SystemExit("SPDX version is missing")
          if not isinstance(payload.get("packages"), list):
              raise SystemExit("SPDX package list is missing")
          PY

      - name: Install checksum-pinned Trivy 0.70.0
        env:
          TRIVY_VERSION: "0.70.0"
          TRIVY_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          bin_dir="$RUNNER_TEMP/trivy-bin"
          mkdir -p "$bin_dir"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$bin_dir" trivy
          chmod 0755 "$bin_dir/trivy"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Block HIGH and CRITICAL vulnerabilities in local image
        run: |
          set -euo pipefail
          trivy image \
            --scanners vuln \
            --pkg-types os,library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed=false \
            --format json \
            --output trivy-results.json \
            --exit-code 1 \
            --timeout 10m \
            "upgrade-rpg-backend:scan-${GITHUB_SHA}"

      - name: Validate local Trivy JSON evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("trivy-results.json").read_text(encoding="utf-8"))
          if not isinstance(payload.get("Results"), list):
              raise SystemExit("Trivy Results list is missing")
          PY

      - name: Retain non-secret review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backend-sbom-and-vulnerability-report-${{ github.sha }}
          path: |
            sbom.spdx.json
            trivy-results.json
          if-no-files-found: error
          retention-days: 14

  publish_sign_verify:
    name: Publish, attest, sign, and verify exact digest
    needs: build_scan
    runs-on: ubuntu-latest
    environment: ghcr-production-publish
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 2
          persist-credentials: false

      - name: Enforce owner-only two-step authorization gate before registry access
        env:
          APPROVED_PREPARATION_COMMIT: ${{ inputs.approved_preparation_commit }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          lifecycle_path = "deploy/github-actions-ghcr-publish-lifecycle.json"

          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise SystemExit(message)

          def git(*args: str) -> str:
              return subprocess.run(
                  ("git", *args), check=True, capture_output=True, text=True, encoding="utf-8"
              ).stdout.strip()

          source = os.environ["SOURCE_COMMIT"]
          preparation = os.environ["APPROVED_PREPARATION_COMMIT"]
          require(os.environ["EXPECTED_RUN_ATTEMPT"] == "1", "workflow re-runs are forbidden")
          require(git("rev-parse", "HEAD") == source, "publish checkout differs from source_commit")
          ancestry = git("rev-list", "--parents", "-n", "1", source).split()
          require(len(ancestry) == 2 and ancestry[1] == preparation, "publish authorization ancestry differs")
          changed = git("diff", "--name-only", "--diff-filter=ACDMRTUXB", preparation, source).splitlines()
          require(changed == [lifecycle_path], "publish authorization changed an unapproved path")
          lifecycle = json.loads(Path(lifecycle_path).read_text(encoding="utf-8"))
          require(lifecycle.get("state") == "authorization-open", "publish authorization is not open")
          require(lifecycle.get("publishReviewerGateReady") is True, "publish gate is not source-controlled true")
          require(lifecycle.get("approvedPreparationSha") == preparation, "approved preparation SHA differs")
          require(lifecycle.get("ownerApproval", {}).get("recorded") is True, "owner approval is not recorded")
          PY

      - name: Set up Python 3.11.15
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11.15"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Install checksum-pinned Trivy 0.70.0
        env:
          TRIVY_VERSION: "0.70.0"
          TRIVY_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          bin_dir="$RUNNER_TEMP/trivy-bin"
          mkdir -p "$bin_dir"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$bin_dir" trivy
          chmod 0755 "$bin_dir/trivy"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Log in to GHCR with ephemeral GITHUB_TOKEN
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push digest candidate with BuildKit attestations
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: backend/Dockerfile.production
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:unverified-sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Record exact pushed digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s@%s\n' "$IMAGE_REPOSITORY" "$DIGEST" > published-image-digest.txt

      - name: Inspect BuildKit provenance and SBOM on exact digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE_REPOSITORY@$DIGEST" --format '{{ json .Provenance }}' > registry-provenance.json
          docker buildx imagetools inspect "$IMAGE_REPOSITORY@$DIGEST" --format '{{ json .SBOM }}' > registry-sbom.json
          python - <<'PY'
          import json
          from pathlib import Path

          provenance = json.loads(Path("registry-provenance.json").read_text(encoding="utf-8"))
          sbom = json.loads(Path("registry-sbom.json").read_text(encoding="utf-8"))
          slsa = provenance.get("SLSA")
          if not isinstance(slsa, dict):
              raise SystemExit("SLSA provenance is missing")
          build_definition = slsa.get("buildDefinition")
          if not isinstance(build_definition, dict):
              raise SystemExit("SLSA buildDefinition is missing")
          if not build_definition.get("buildType"):
              raise SystemExit("SLSA buildDefinition.buildType is missing")
          if sbom.get("SPDX", {}).get("SPDXID") != "SPDXRef-DOCUMENT":
              raise SystemExit("registry SPDX SBOM is missing")
          PY

      - name: Block vulnerabilities in exact pushed digest before signing
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          trivy image \
            --scanners vuln \
            --pkg-types os,library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed=false \
            --format json \
            --output published-trivy-results.json \
            --exit-code 1 \
            --timeout 10m \
            "$IMAGE_REPOSITORY@$DIGEST"

      - name: Validate exact-digest Trivy JSON evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("published-trivy-results.json").read_text(encoding="utf-8"))
          if not isinstance(payload.get("Results"), list):
              raise SystemExit("exact-digest Trivy Results list is missing")
          PY

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign exact digest with GitHub OIDC after all image gates
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "$IMAGE_REPOSITORY@$DIGEST"

      - name: Verify Cosign certificate identity and issuer
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE_REPOSITORY@$DIGEST" > cosign-verification.json

      - name: Retain exact-digest evidence
        if: ${{ always() && steps.publish.outputs.digest != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backend-published-digest-evidence-${{ github.sha }}
          path: |
            published-image-digest.txt
            registry-provenance.json
            registry-sbom.json
            published-trivy-results.json
            cosign-verification.json
          if-no-files-found: error
          retention-days: 14

      - name: Emit verified candidate digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Verified candidate: $IMAGE_REPOSITORY@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
