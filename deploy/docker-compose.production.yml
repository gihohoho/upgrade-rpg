# v320 managed PostgreSQL + external reverse proxy production review template only.
# This file is approved for `docker compose config` rendering with review-only
# sentinel values. Do not pull/build/start containers or use real production
# secrets until each later approval boundary is explicitly granted.
services:
  backend:
    image: ${BACKEND_IMAGE:?Set an approved digest-pinned backend image}
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Idle RPG Backend}
      ENVIRONMENT: production
      DEBUG: "false"
      API_PREFIX: /api/v1
      DATABASE_URL: ${DATABASE_URL:?Set the managed PostgreSQL verify-full DATABASE_URL}
      DB_POOL_PRE_PING: "true"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ADMIN_WRITE_DEV_KEY: ${ADMIN_WRITE_DEV_KEY:?Set ADMIN_WRITE_DEV_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set production HTTPS CORS_ORIGINS}
    expose:
      - "8000"
    secrets:
      - source: postgres_ca
        target: postgres_ca.pem
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: 1

secrets:
  postgres_ca:
    file: ${POSTGRES_CA_FILE:?Set a host path containing the approved managed PostgreSQL CA PEM}

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK_NAME:?Set the pre-created reverse proxy network name}
